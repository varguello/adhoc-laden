<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ad-hoc Lade-Manager</title>
    <style>
      :root {
        --bg: #121212;
        --card: #1e1e1e;
        --text: #f5f5f7;
        --accent: #0a84ff;
        --green: #30d158;
        --danger: #ff453a;
        --border: #333;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 16px;
        max-width: 600px;
        margin-inline: auto;
      }
      h1 {
        font-size: 1.4rem;
        margin-bottom: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      button {
        cursor: pointer;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 12px 16px;
        transition: opacity 0.2s;
      }
      button:active {
        opacity: 0.7;
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
        width: 100%;
      }
      .btn-toggle {
        background: var(--card);
        color: var(--accent);
        border: 1px solid var(--border);
        padding: 8px 12px;
        font-size: 0.85rem;
      }
      .btn-actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .btn-edit {
        background: transparent;
        color: var(--accent);
        font-size: 0.8rem;
        padding: 6px 10px;
        border: 1px solid var(--accent);
        border-radius: 6px;
        flex: 1;
      }
      .btn-del {
        background: transparent;
        color: var(--danger);
        font-size: 0.8rem;
        padding: 6px 10px;
        border: 1px solid var(--danger);
        border-radius: 6px;
        flex: 1;
      }

      /* Formular-Box */
      #form-box {
        display: none;
        background: var(--card);
        padding: 16px;
        border-radius: 12px;
        border: 1px solid var(--border);
        margin-bottom: 20px;
      }
      label {
        display: block;
        font-size: 0.85rem;
        margin-top: 12px;
        margin-bottom: 4px;
        color: #aaa;
      }
      input,
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #2c2c2e;
        color: #fff;
        font-size: 1rem;
      }

      /* Säulen-Akkordeon */
      details {
        background: var(--card);
        border-radius: 12px;
        margin-bottom: 12px;
        padding: 14px;
        border: 1px solid var(--border);
      }
      summary {
        font-weight: 700;
        font-size: 1.05rem;
        cursor: pointer;
        list-style: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      .badge {
        font-size: 0.75rem;
        padding: 3px 8px;
        border-radius: 6px;
        font-weight: bold;
      }
      .badge-dc {
        background: var(--accent);
        color: #fff;
      }
      .badge-ac {
        background: var(--green);
        color: #000;
      }
      .saeule-img {
        width: 100%;
        border-radius: 8px;
        margin-top: 12px;
        max-height: 260px;
        object-fit: cover;
      }
      .desc {
        font-size: 0.9rem;
        color: #ccc;
        margin: 10px 0;
      }
      .start-link {
        display: block;
        text-align: center;
        background: var(--green);
        color: #000;
        text-decoration: none;
        font-weight: 700;
        padding: 14px;
        border-radius: 8px;
        margin-top: 12px;
      }
      #status {
        font-size: 0.85rem;
        color: #aaa;
        text-align: center;
        margin: 10px 0;
      }
    </style>
  </head>
  <body>
    <h1>
      <span>⚡ Ladesäulen</span>
      <div>
        <button class="btn-toggle" onclick="toggleForm()">+ Neu</button>
        <button
          class="btn-toggle"
          onclick="resetToken()"
          title="Token zurücksetzen"
        >
          🔑
        </button>
      </div>
    </h1>

    <!-- Eingabeformular -->
    <div id="form-box">
      <h3 id="form-title" style="margin-top: 0">Neue Säule / Anschluss</h3>
      <label>Standort & Name (z. B. Edeka Säule 1)</label>
      <input type="text" id="inp-name" placeholder="Edeka – Säule 1" />

      <label>Anschluss-Typ</label>
      <select id="inp-type">
        <option value="DC">DC Schnelllader (CCS)</option>
        <option value="AC">AC Typ-2 Buchse</option>
      </select>

      <label>Ad-hoc URL (aus QR-Code)</label>
      <input type="url" id="inp-url" placeholder="https://..." />

      <label>Kurze Beschreibung / Position</label>
      <input
        type="text"
        id="inp-desc"
        placeholder="Rechter Stellplatz, Buchse links"
      />

      <label>Foto der Säule (optional / neu)</label>
      <input type="file" id="inp-img" accept="image/*" />

      <button
        id="btn-submit"
        class="btn-primary"
        style="margin-top: 16px"
        onclick="handleSave()"
      >
        Speichern
      </button>
    </div>

    <div id="status">Lade Daten...</div>
    <div id="list"></div>

    <script>
      // === KONFIGURATION ===
      const OWNER = "varguello";
      const REPO = "adhoc-laden";
      const PATH = "saeulen.json";
      // =====================

      let saeulenData = [];
      let editingId = null; // null = neu anlegen, ansonsten ID der zu bearbeitenden Säule

      function getToken() {
        let token = localStorage.getItem("gh_lade_token");
        if (!token) {
          token = prompt(
            "Bitte GitHub Personal Access Token eingeben (für Schreibrechte):",
          );
          if (token) localStorage.setItem("gh_lade_token", token.trim());
        }
        return token ? token.trim() : null;
      }

      function resetToken() {
        localStorage.removeItem("gh_lade_token");
        alert("Token aus dem Browser-Speicher gelöscht.");
      }

      function toggleForm() {
        const box = document.getElementById("form-box");
        const isVisible = box.style.display === "block";
        if (isVisible) {
          resetForm();
          box.style.display = "none";
        } else {
          resetForm();
          box.style.display = "block";
        }
      }

      function resetForm() {
        editingId = null;
        document.getElementById("form-title").textContent =
          "Neue Säule / Anschluss";
        document.getElementById("btn-submit").textContent = "Speichern";
        document.getElementById("inp-name").value = "";
        document.getElementById("inp-type").value = "DC";
        document.getElementById("inp-url").value = "";
        document.getElementById("inp-desc").value = "";
        document.getElementById("inp-img").value = "";
      }

      function editSaeule(id) {
        const item = saeulenData.find((i) => i.id === id);
        if (!item) return;

        editingId = id;
        document.getElementById("form-title").textContent =
          `Bearbeite: ${item.name}`;
        document.getElementById("btn-submit").textContent =
          "Änderungen übernehmen";
        document.getElementById("inp-name").value = item.name;
        document.getElementById("inp-type").value = item.type;
        document.getElementById("inp-url").value = item.url;
        document.getElementById("inp-desc").value = item.desc || "";
        document.getElementById("inp-img").value = ""; // Datei-Input kann aus Sicherheitsgründen nicht vorbelegt werden

        const box = document.getElementById("form-box");
        box.style.display = "block";
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function encodeBase64(str) {
        return btoa(unescape(encodeURIComponent(str)));
      }

      function compressImage(file) {
        return new Promise((resolve) => {
          if (!file) return resolve(null);
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement("canvas");
              const maxW = 800;
              const scale = img.width > maxW ? maxW / img.width : 1;
              canvas.width = img.width * scale;
              canvas.height = img.height * scale;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              resolve(canvas.toDataURL("image/jpeg", 0.75));
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        });
      }

      async function loadData() {
        setStatus("Lade Daten...");
        try {
          const res = await fetch(`${PATH}?t=${Date.now()}`);
          if (!res.ok)
            throw new Error(
              "Datei konnte nicht geladen werden (" + res.status + ")",
            );
          saeulenData = await res.json();
          renderList();
          setStatus("");
        } catch (err) {
          setStatus("Fehler beim Laden: " + err.message);
        }
      }

      async function saveToGitHub(commitMsg) {
        const token = getToken();
        if (!token) return alert("Ohne Token kann nicht gespeichert werden.");

        setStatus("Verbinde mit GitHub...");

        try {
          const getRes = await fetch(
            `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`,
            {
              headers: { Authorization: `token ${token}` },
            },
          );
          if (!getRes.ok)
            throw new Error(
              "Authentifizierung oder Pfad fehlerhaft (" + getRes.status + ")",
            );
          const fileMeta = await getRes.json();
          const currentSha = fileMeta.sha;

          setStatus("Speichere Änderungen...");

          const putRes = await fetch(
            `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`,
            {
              method: "PUT",
              headers: {
                Authorization: `token ${token}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                message: commitMsg,
                content: encodeBase64(JSON.stringify(saeulenData, null, 2)),
                sha: currentSha,
              }),
            },
          );

          if (!putRes.ok)
            throw new Error("Speichern fehlgeschlagen (" + putRes.status + ")");

          await loadData();
          setStatus("Erfolgreich gespeichert!");
          setTimeout(() => setStatus(""), 2000);
        } catch (err) {
          setStatus("Fehler: " + err.message);
        }
      }

      async function handleSave() {
        const name = document.getElementById("inp-name").value.trim();
        const type = document.getElementById("inp-type").value;
        const url = document.getElementById("inp-url").value.trim();
        const desc = document.getElementById("inp-desc").value.trim();
        const file = document.getElementById("inp-img").files[0];

        if (!name || !url)
          return alert("Bitte mindestens Name und URL angeben.");

        setStatus("Verarbeite Bild...");
        const newImgBase64 = await compressImage(file);

        if (editingId !== null) {
          // Bestehende Säule aktualisieren
          const item = saeulenData.find((i) => i.id === editingId);
          if (item) {
            item.name = name;
            item.type = type;
            item.url = url;
            item.desc = desc;
            if (newImgBase64) {
              item.img = newImgBase64; // Nur überschreiben, wenn ein neues Bild gewählt wurde
            }
          }
          await saveToGitHub(`Säule bearbeitet: ${name}`);
        } else {
          // Neue Säule hinzufügen
          saeulenData.push({
            id: Date.now(),
            name,
            type,
            url,
            desc,
            img: newImgBase64,
          });
          await saveToGitHub(`Säule hinzugefügt: ${name}`);
        }

        toggleForm();
      }

      async function deleteSaeule(id) {
        if (!confirm("Diesen Eintrag wirklich löschen?")) return;
        saeulenData = saeulenData.filter((item) => item.id !== id);
        await saveToGitHub("Säule gelöscht");
      }

      function renderList() {
        const container = document.getElementById("list");
        container.innerHTML = "";
        if (saeulenData.length === 0) {
          container.innerHTML =
            "<p style='text-align:center;color:#777;'>Noch keine Ladesäulen gespeichert.</p>";
          return;
        }

        saeulenData.forEach((item) => {
          const badgeClass = item.type === "DC" ? "badge-dc" : "badge-ac";
          const imgHtml = item.img
            ? `<img class="saeule-img" src="${item.img}" alt="${item.name}">`
            : "";
          const descHtml = item.desc
            ? `<div class="desc">${item.desc}</div>`
            : "";

          container.innerHTML += `
        <details>
          <summary>
            <span>${item.name}</span>
            <span class="badge ${badgeClass}">${item.type}</span>
          </summary>
          ${imgHtml}
          ${descHtml}
          <a class="start-link" href="${item.url}" target="_blank">⚡ Ladevorgang starten</a>
          <div class="btn-actions">
            <button class="btn-edit" onclick="editSaeule(${item.id})">✏️ Bearbeiten</button>
            <button class="btn-del" onclick="deleteSaeule(${item.id})">🗑️ Löschen</button>
          </div>
        </details>
      `;
        });
      }

      function setStatus(msg) {
        document.getElementById("status").textContent = msg;
      }

      loadData();
    </script>
  </body>
</html>
