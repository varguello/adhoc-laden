<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ad-hoc Lade-Manager</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>
      <span>⚡ Ladesäulen</span>
      <div>
        <button class="btn-toggle" onclick="toggleForm()">+ Neu</button>
        <button
          class="btn-toggle"
          onclick="resetToken()"
          title="Token zurücksetzen"
        >
          🔑
        </button>
      </div>
    </h1>

    <!-- Eingabeformular -->
    <div id="form-box">
      <h3 id="form-title" style="margin-top: 0">Neue Säule / Anschluss</h3>
      <label>Standort & Name (z. B. Edeka Säule 1)</label>
      <input type="text" id="inp-name" placeholder="Edeka – Säule 1" />

      <label>Gruppe (vorhandene wählen oder neue eintippen)</label>
      <input
        type="text"
        id="inp-group"
        list="group-list"
        placeholder="z. B. Edeka Säule näher an Packstation"
      />
      <datalist id="group-list"></datalist>

      <label>Anschluss-Typ</label>
      <select id="inp-type">
        <option value="DC">DC Schnelllader (CCS)</option>
        <option value="AC">AC Typ-2 Buchse</option>
      </select>

      <label>Ad-hoc URL (aus QR-Code)</label>
      <input type="url" id="inp-url" placeholder="https://..." />

      <label>Kurze Beschreibung / Position</label>
      <input
        type="text"
        id="inp-desc"
        placeholder="Rechter Stellplatz, Buchse links"
      />

      <label>Foto der Säule (optional / neu, überschreibt für diesen Eintrag das Gruppenbild)</label>
      <input type="file" id="inp-img" accept="image/*" />

      <label>Gruppenbild (optional, Standardbild für alle Einträge dieser Gruppe ohne eigenes Foto)</label>
      <input type="file" id="inp-group-img" accept="image/*" />

      <div class="form-actions">
        <button type="button" class="btn-cancel" onclick="cancelForm()">
          Abbrechen
        </button>
        <button id="btn-submit" class="btn-primary" onclick="handleSave()">
          Speichern
        </button>
      </div>
    </div>

    <div id="status">Lade Daten...</div>
    <div id="list"></div>

    <script src="util.js"></script>
  </body>
</html>
